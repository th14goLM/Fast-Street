# CI da Fast Street (Fase 1 do docs/PLANO_DEPLOY_AUTOMATICO.md).
# Roda em todo PR para o main e em todo push no main. Os nomes dos jobs ("API" e "Mobile") são os
# que a proteção do main exige como verificações obrigatórias: se mudar um nome, atualize a regra.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Um push novo no mesmo PR cancela a execução anterior (no main, cada commit roda até o fim).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Só leitura do código: o CI não publica nada nem precisa de segredos.
permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    services:
      # Banco descartável só para os testes de integração. As credenciais abaixo NÃO são segredos:
      # o contêiner existe apenas durante este job e não é alcançável de fora do runner.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fast_street_test
          MYSQL_USER: fast_street
          MYSQL_PASSWORD: fast_street
        ports:
          - 3306:3306
        # Pelo TCP (e não pelo socket): só responde quando o servidor definitivo sobe, depois da inicialização.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # Mesmo usuário sem privilégios de administração que o app usa (não o root).
      TEST_DATABASE_URL: mysql://fast_street:fast_street@127.0.0.1:3306/fast_street_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # mesma versão da produção (EC2) e da imagem Docker
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      # O build de produção (tsc -p tsconfig.build.json + cópia das migrations) também precisa passar.
      - run: npm run build

  mobile:
    name: Mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      # --max-warnings 0: aviso do ESLint também reprova (ex.: variável não usada).
      - run: npx expo lint --max-warnings 0
