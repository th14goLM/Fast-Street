# /etc/nginx/sites-available/fast-street  (versão FINAL, em produção, com HTTPS)
# Ponto de partida: fast-street.conf (só HTTP). O "certbot --nginx" emitiu o certificado e
# inseriu as linhas "managed by Certbot"; depois o arquivo foi reorganizado à mão, nesta forma.
#
#   Internet ──80──▶ redireciona para https://faststreet.duckdns.org
#   Internet ──443 (TLS)──▶ Nginx ──127.0.0.1:3333──▶ fast-street-api.service ──▶ MySQL (127.0.0.1:3306)
#
# Validar e aplicar:  sudo nginx -t && sudo systemctl reload nginx

upstream fast_street_api {
    server 127.0.0.1:3333;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=fast_street_por_ip:10m rate=20r/s;

log_format fast_street '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                       'rt=$request_time upstream=$upstream_addr ustatus=$upstream_status '
                       'urt=$upstream_response_time "$http_user_agent"';

# ── Porta 80: só redireciona. Vale também para quem acessa pelo IP (http://18.116.147.33),
# que é levado ao nome com certificado válido. A renovação do certificado (desafio HTTP-01)
# segue o redirecionamento e é validada pela porta 443.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name faststreet.duckdns.org;
    server_tokens off;
    access_log /var/log/nginx/fast-street.access.log fast_street;
    return 301 https://faststreet.duckdns.org$request_uri;
}

# ── Porta 443: TLS + proxy reverso para a API
server {
    # Nginx 1.24 (Ubuntu 24.04): HTTP/2 se liga no "listen" ("http2 on;" só existe a partir do 1.25.1).
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 ipv6only=on default_server;
    server_name faststreet.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/faststreet.duckdns.org/fullchain.pem;   # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/faststreet.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                              # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                                # managed by Certbot

    # HSTS (Strict-Transport-Security) já é enviado pela própria API (helmet), por isso não é
    # repetido aqui: o cabeçalho sairia duplicado.

    server_tokens off;
    client_max_body_size 2m;           # fotos do app: até 1 MB (RN-VEI-02) + margem do multipart

    access_log /var/log/nginx/fast-street.access.log fast_street;
    error_log  /var/log/nginx/fast-street.error.log warn;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 512;

    location / {
        limit_req zone=fast_street_por_ip burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://fast_street_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # API parada ou sem resposta: o Nginx continua de pé e devolve 502 com JSON legível pelo app.
    # O motivo (ex.: "connect() failed (111: Connection refused)") fica em fast-street.error.log.
    error_page 502 504 = @api_indisponivel;
    location @api_indisponivel {
        default_type application/json;
        return 502 '{"error":{"code":"API_INDISPONIVEL","message":"O servidor da Fast Street está temporariamente indisponível."}}';
    }
}
