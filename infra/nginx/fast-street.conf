# /etc/nginx/sites-available/fast-street
# Proxy reverso da Fast Street API (backend do PROEX).
#
#   Internet ──80/443──▶ Nginx (este arquivo) ──127.0.0.1:3333──▶ fast-street-api.service ──▶ MySQL (127.0.0.1:3306)
#
# Instalação:  sudo cp infra/nginx/fast-street.conf /etc/nginx/sites-available/fast-street
#              sudo ln -s /etc/nginx/sites-available/fast-street /etc/nginx/sites-enabled/fast-street
#              sudo rm /etc/nginx/sites-enabled/default      # o site padrão capturaria o mesmo endereço
#              sudo nginx -t && sudo systemctl reload nginx  # só recarrega se a sintaxe estiver válida
#
# HTTPS: o "certbot --nginx" acrescenta a este arquivo o bloco "listen 443 ssl" e o
# redirecionamento 80 → 443 (versão final, como ficou no servidor: fast-street.https.conf).

# Diretivas de contexto "http": o Ubuntu inclui sites-enabled/* dentro do bloco http do nginx.conf.

# Backend: a API escuta só no loopback. "keepalive" reaproveita conexões Nginx → Node.
upstream fast_street_api {
    server 127.0.0.1:3333;
    keepalive 16;
}

# Limite de requisições por IP (proteção simples contra abuso; não é teste de carga).
limit_req_zone $binary_remote_addr zone=fast_street_por_ip:10m rate=20r/s;

# Log de acesso com tempo de resposta e status do upstream: diferencia erro do Nginx de erro da API.
log_format fast_street '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                       'rt=$request_time upstream=$upstream_addr ustatus=$upstream_status '
                       'urt=$upstream_response_time "$http_user_agent"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Nome DNS (DuckDNS → IP elástico). O certbot procura o bloco por este nome para instalar o TLS.
    server_name faststreet.duckdns.org;

    server_tokens off;                 # não anuncia a versão do Nginx
    client_max_body_size 2m;           # fotos do app: até 1 MB (RN-VEI-02) + margem do multipart

    access_log /var/log/nginx/fast-street.access.log fast_street;
    error_log  /var/log/nginx/fast-street.error.log warn;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 512;

    location / {
        limit_req zone=fast_street_por_ip burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://fast_street_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # API parada ou sem resposta: o Nginx continua de pé e devolve 502/504 com um JSON legível
    # pelo app (em vez da página HTML padrão). O motivo fica em fast-street.error.log.
    error_page 502 504 = @api_indisponivel;
    location @api_indisponivel {
        default_type application/json;
        return 502 '{"error":{"code":"API_INDISPONIVEL","message":"O servidor da Fast Street está temporariamente indisponível."}}';
    }
}
