# Produção (servidor EC2): MySQL + API + Caddy, tudo em contêineres.
# Uso no servidor (passo a passo em docs/DEPLOY_AWS.md):
#   cp deploy/env.prod.example .env            # senhas do MySQL e endereço do site
#   cp api/.env.production.example api/.env    # configuração da API
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Só o Caddy fica exposto (portas 80/443). O MySQL e a API ficam na rede interna do Compose.
name: fast-street

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env (copie de deploy/env.prod.example)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fast_street}
      MYSQL_USER: ${MYSQL_USER:-fast_street}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env (copie de deploy/env.prod.example)}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      retries: 30

  api:
    build: ./api
    init: true
    image: fast-street-api:latest
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      # Montada aqui para usar as mesmas credenciais do MySQL; sobrescreve a do api/.env.
      DATABASE_URL: mysql://${MYSQL_USER:-fast_street}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-fast_street}
      NODE_ENV: production
      PORT: 3333
      UPLOAD_DIR: uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # ":80" = acesso por IP (HTTP). Com domínio (ex.: api.faststreet.com.br), o Caddy emite o HTTPS sozinho.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql-data:
  uploads:
  caddy-data:
  caddy-config:
